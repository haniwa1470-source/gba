name: Setup mGBA celio Black Web

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Download the current mGBA celio Web build
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch gh-pages https://github.com/liru55/mgba-celio-web.git upstream
          rm -rf site
          mkdir site
          cp -a upstream/. site/
          rm -rf site/.git

      - name: Apply black minimal skin
        shell: bash
        run: |
          set -euxo pipefail
          echo '{position:absolute;left:50%;top:33vw;transform:translate(-50%,-50%);z-index:15;width:210px;max-width:calc(100% - 30px);display:flex;flex-direction:column;align-items:center;gap:5px;background:#0b0b0bf2;border:1px solid #303030;box-shadow:0 8px 30px #000}
#pause-banner strong{font-size:18px}
#pause-banner span{font-size:12px;color:#999}
#link-hud{position:absolute;top:8px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:5px;z-index:18;white-space:nowrap;max-width:calc(100% - 12px);background:#080808e8;border:1px solid #222;border-radius:999px;padding:4px}
#link-hud span{font-size:11px;padding:4px}
#link-hud button{font-size:11px;padding:6px 9px;min-height:36px}
#link-hud button[aria-pressed=true]{background:#2a2a2a}
#link-hud[hidden],#pause-banner[hidden]{display:none!important}

/* settings */
dialog{border:1px solid #252525;border-radius:20px;background:#080808;color:#eee;width:min(94vw,540px);max-height:88dvh;padding:18px;overflow:auto;box-shadow:0 20px 80px #000}
dialog::backdrop{background:#000c;backdrop-filter:blur(5px)}
.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:-18px;padding:10px 0;background:#080808;z-index:2}
.dialog-head h2{font-size:19px;margin:0}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin:14px 0}
.tabs button{padding:10px 3px;border-color:#222;background:#0e0e0e;font-size:12px}
.tabs [aria-selected=true]{background:#252525;border-color:#404040}
dialog h3{font-size:15px;margin:18px 0 10px}
dialog p,dialog li{color:#aaa;font-size:13px;line-height:1.7}
dialog small{display:block;color:#8f8f8f;font-size:12px;line-height:1.6}
dialog .wide{width:100%;margin:6px 0;min-width:0;min-height:44px}
.secondary{background:transparent!important}
.row{display:flex;gap:10px;align-items:center;padding:11px 0;font-size:14px}
.row input{width:20px;height:20px}
.field{display:grid;grid-template-columns:1fr auto;gap:9px;margin:15px 0;font-size:14px}
.field select,.field input,.field textarea{grid-column:1/-1;width:100%;min-height:38px;background:#111!important;color:#ddd!important;border:1px solid #2c2c2c;border-radius:9px;padding:9px}
textarea{resize:vertical;font:14px monospace}
.field output{color:#bbb}
.mapping-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mapping-grid label{display:grid;gap:5px;font-size:13px}
.mapping-grid select{min-width:0;width:100%;background:#111;color:#ddd;border:1px solid #2c2c2c;border-radius:8px;padding:9px}
dialog hr{border:0;border-top:1px solid #222;margin:20px 0}
dialog details{margin:0 0 14px}
dialog details summary{background:transparent;text-align:left;padding:11px 0}
#save-name{padding:10px;background:#101010;border-radius:8px;overflow-wrap:anywhere}
.help-link{display:block;padding:13px;margin:4px 0 12px;text-align:center;color:#bbb;background:#101010;border:1px solid #292929;border-radius:12px;text-decoration:none;font-size:13px}
.link-buttons{display:flex;gap:8px}.link-buttons button{flex:1;min-height:44px}
select{color-scheme:dark}

#edit-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px;font-size:12px;color:#ddd;background:#111;border-radius:10px}
.play #edit-bar{position:absolute;bottom:max(8px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:30;width:max-content;max-width:calc(100% - 16px)}
#fullscreen-layout{display:none!important}

/* fullscreen */
.play:fullscreen,.play.immersive,.expanded .play{position:fixed!important;inset:0!important;z-index:60!important;width:100%!important;height:100dvh!important;background:#000!important;display:block!important;padding:0!important}
.play:fullscreen #screen,.play.immersive #screen,.expanded .play #screen{width:100%!important;height:100%!important;aspect-ratio:auto!important;object-fit:contain!important;border-radius:0!important}
.play.immersive .gamepad,.expanded .play .gamepad{position:absolute!important;inset:0!important;height:100%!important;padding:0!important;pointer-events:none!important}
.play.immersive .dpad,.play.immersive .ab,.play.immersive .shoulders,.play.immersive .system,.expanded .play .dpad,.expanded .play .ab,.expanded .play .shoulders,.expanded .play .system{position:absolute!important;pointer-events:auto!important;opacity:var(--pad-opacity,.55)!important}
.play.immersive .shoulders,.expanded .play .shoulders{left:50%!important;top:14%!important;width:84%!important;transform:translate(-50%,-50%) scale(var(--pad-scale,.75))!important}
.play.immersive .dpad,.expanded .play .dpad{left:13%!important;top:68%!important;transform:translate(-50%,-50%) scale(var(--pad-scale,.75))!important}
.play.immersive .ab,.expanded .play .ab{left:87%!important;top:68%!important;transform:translate(-50%,-50%) rotate(-10deg) scale(var(--pad-scale,.75))!important}
.play.immersive .system,.expanded .play .system{left:50%!important;top:90%!important;transform:translate(-50%,-50%) scale(var(--pad-scale,.75))!important}
.play.immersive #quick-actions,.expanded .play #quick-actions{position:absolute!important;top:max(10px,env(safe-area-inset-top))!important;left:50%!important;right:auto!important;width:230px!important;margin:0!important;transform:translateX(-50%)!important;z-index:70!important}
.play.immersive~.toolbar,.expanded .toolbar{display:none!important}
#fullscreen-exit{position:absolute;z-index:80;top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));min-height:40px;padding:8px 11px;opacity:.6;background:#0b0b0bcc;border-color:#333;font-size:11px}
.clean-view header,.clean-view #status,.clean-view .toolbar,.clean-view .notice,.clean-view .gamepad,.clean-view #fullscreen-exit,.clean-view #edit-bar,.clean-view #quick-actions,.clean-view #quick-message{visibility:hidden!important}

@media(max-width:390px){
  .dpad{grid-template-columns:repeat(3,48px)!important;grid-template-rows:repeat(3,48px)!important;width:144px;height:144px}
  .ab button{width:62px!important;height:62px!important}
  .primary{gap:12px;padding:0 2px}
  #quick-actions{width:calc(100% - 106px);margin-right:98px}
  .toolbar #settings-open{width:82px}
}
@media(orientation:landscape) and (max-height:550px){
  body{padding:0}
  main{max-width:none}
  .play{height:100dvh}
  #screen{height:100dvh!important;width:100%!important;aspect-ratio:auto!important;object-fit:contain!important}
  #quick-actions{position:absolute!important;top:max(8px,env(safe-area-inset-top))!important;left:50%!important;right:auto!important;width:210px!important;margin:0!important;transform:translateX(-50%)!important;z-index:25!important}
  .toolbar{top:max(8px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right));z-index:26}
  .gamepad{position:absolute!important;inset:0!important;height:100%!important;padding:0!important;pointer-events:none!important}
  .dpad,.ab,.shoulders,.system{position:absolute!important;pointer-events:auto!important;opacity:.55!important}
  .shoulders{left:50%!important;top:14%!important;width:82%!important;transform:translate(-50%,-50%) scale(.72)!important}
  .dpad{left:12%!important;top:68%!important;transform:translate(-50%,-50%) scale(.72)!important}
  .ab{left:88%!important;top:68%!important;transform:translate(-50%,-50%) rotate(-10deg) scale(.72)!important}
  .system{left:50%!important;top:90%!important;transform:translate(-50%,-50%) scale(.72)!important}
  dialog{max-height:94dvh}
}
' | base64 --decode > site/styles.css

          python3 - <<'PY'
